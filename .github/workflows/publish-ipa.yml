name: Publish unsigned IPA
# Builds the unsigned iOS app and attaches the IPA to a GitHub Release.
# The build itself lives in ios.yml so this file does not keep a second copy of the
# Xcode/Rust steps or a hardcoded artifact from an old run.
on:
  workflow_dispatch:
  push:
    tags:
      - 'ios-v*'
permissions:
  contents: write
  actions: read
jobs:
  build-and-publish:
    uses: ./.github/workflows/ios.yml
    permissions:
      contents: write
      actions: read
