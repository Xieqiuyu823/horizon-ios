name: Verify iOS game files
on:
  push:
    branches: [verify/ios-game-download]
permissions:
  contents: read
concurrency:
  group: verify-ios-game-files
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Select an iOS Simulator
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(device["udid"] for runtime,devices in json.load(sys.stdin)["devices"].items() if ".iOS-" in runtime for device in devices if device["name"].startswith("iPhone")))')
          printf 'HORIZON_TEST_SIMULATOR=%s\n' "$device" >> "$GITHUB_ENV"
      - name: Build launcher tests
        run: |
          xcodegen generate --spec packaging/ios/Preview/project.yml
          xcodebuild -project packaging/ios/Preview/LauncherPreview.xcodeproj \
            -scheme LauncherPreview -destination "platform=iOS Simulator,id=$HORIZON_TEST_SIMULATOR" \
            -derivedDataPath "$RUNNER_TEMP/horizon-game-files" build-for-testing -quiet
      - name: Exercise game-file download and recovery
        run: |
          python3 tools/test_ios_game_files.py --device "$HORIZON_TEST_SIMULATOR" --derived-data "$RUNNER_TEMP/horizon-game-files" || {
            tail -100 "$RUNNER_TEMP/horizon-game-files/auto-files-test.log" || true
            exit 1
          }
