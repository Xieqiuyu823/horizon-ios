name: Build unsigned IPA
# The game for iPhone and iPad, and nothing else: the Rust game cross-compiled for aarch64-apple-ios, wrapped by
# packaging/ios/project.yml's HorizonGame target, and uploaded as an unsigned .ipa. No tests run here.
# A successful build is also published with tools/ci/publish-ios-release.sh (the same release script the
# old main-branch job used). The IPA is unsigned: sign it before installing. Ad-hoc signatures are rejected
# by tools/ci/ios_release.py.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
      - main
      - cursor/ios-entry-when-files-server-down-bf35
    # Manual tags are started by publish-ipa.yml, which calls this workflow. Do not also list
    # them here: publish-ios-release.sh creates ios-build-* tags, and a second listener would
    # build the same commit twice.
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
env:
  HORIZON_TELEMETRY_URL: "off"
  IOS_TARGET: aarch64-apple-ios
  # Public application ID embedded in the official Horizon launcher release.
  HORIZON_MSA_CLIENT_ID: "331e08f8-172d-43b9-835a-3108c2fcdbf3"
  # `--release` with the `fast` profile's codegen: the release profile's single codegen unit and LTO cost minutes
  # and the unsigned bundle is a test build.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  CARGO_PROFILE_RELEASE_LTO: "false"
  CARGO_INCREMENTAL: "0"
  # The app's own minimum (project.yml); rustc and cc read it, and the Xcode step's Cargo phase sees the same.
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"

jobs:
  ipa:
    # GitHub-hosted macos-26. macos-15 ships Xcode 16, and tools/ci/ios-toolchain.sh refuses anything
    # older than Xcode 26 because the native launcher uses the iOS 26 SDK. Rust and Xcode both
    # target ARM64 iOS below. The IPA is unsigned (CODE_SIGNING_ALLOWED=NO), which is what sideloading
    # tools re-sign; an ad-hoc signature would fail the audit.
    runs-on: macos-26
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the Apple toolchain
        run: bash tools/ci/ios-toolchain.sh
      - name: Install Rust iOS toolchain
        # The workspace MSRV. Stable is newer; this build is pinned so the phone binary matches 1.95.
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ env.IOS_TARGET }}
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        if: runner.environment == 'github-hosted'
        with:
          shared-key: ios-${{ env.IOS_TARGET }}
      - name: Build Rust game for iOS
        # The public Microsoft sign-in app is shared by the Rust executable and native launcher.
        # The defaults minus `controllers` (GameController reads pads), with `audio`: project.yml's Cargo phase
        # uses the same flags, so HORIZON_GAME_PREBUILT below finds this build.
        run: cargo build --release --locked --target "$IOS_TARGET" -p horizon-official --no-default-features --features audio,horizon-extras
      - name: Build unsigned IPA
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          ( cd packaging/ios && xcodegen generate )
          HORIZON_GAME_PREBUILT=1 xcodebuild -project packaging/ios/HorizonIOS.xcodeproj \
            -target HorizonGame -configuration Release -sdk iphoneos -arch arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= CODE_SIGNING_REQUIRED=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CONFIGURATION_BUILD_DIR="$PWD/build-ios" \
            build > xcode-game-build.log 2>&1 || { tail -60 xcode-game-build.log; exit 1; }
          python3 tools/ci/ios_release.py --stamp-app build-ios/HorizonGame.app \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expect-commit "$GITHUB_SHA" --client-id "$HORIZON_MSA_CLIENT_ID"
          rm -rf game-xcode && mkdir -p game-xcode/Payload
          cp -a build-ios/HorizonGame.app game-xcode/Payload/
          ( cd game-xcode && zip -qry ../Horizon-game-unsigned.ipa Payload )
      - name: Preserve the Xcode failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-xcode-failure-log
          path: xcode-game-build.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Audit unsigned IPA
        run: python3 tools/ci/ios_release.py Horizon-game-unsigned.ipa --expect-commit "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: horizon-ios-game
          path: Horizon-game-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

  release:
    needs: ipa
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download unsigned IPA
        uses: actions/download-artifact@v4
        with:
          name: horizon-ios-game
          path: ipa-artifact
      - name: Prepare versioned IPA and checksum
        id: asset
        run: |
          python3 tools/ci/ios_release.py ipa-artifact/Horizon-game-unsigned.ipa \
            --expect-commit "$GITHUB_SHA" --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output-dir release-assets >> "$GITHUB_OUTPUT"
      - name: Publish unsigned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IPA: ${{ steps.asset.outputs.ipa }}
          CHECKSUM: ${{ steps.asset.outputs.checksum }}
          VERSION: ${{ steps.asset.outputs.version }}
          BUILD: ${{ steps.asset.outputs.build }}
        run: bash tools/ci/publish-ios-release.sh
